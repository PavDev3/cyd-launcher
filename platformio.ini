; Launcher (factory) para ESP32 CYD (ESP32-2432S028R, 4MB flash)
; Carga firmwares desde /firmware/*.bin en la microSD hacia el slot app0.
; Flashear este environment en el offset de "factory" (0x10000).

[env:cyd_launcher]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Partition table custom: factory + app0 (un solo slot OTA) ---
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    ; SD y Update.h vienen incluidas en el core ESP32, no requieren lib_deps

build_flags =
    ; ---- Config TFT_eSPI para ILI9341 en CYD (bus HSPI) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; ---- Táctil resistivo XPT2046 (bus VSPI, pines propios) ----
    -DTOUCH_CS=33
    -DTOUCH_CLK=25
    -DTOUCH_MOSI=32
    -DTOUCH_MISO=39
    -DTOUCH_IRQ=36
