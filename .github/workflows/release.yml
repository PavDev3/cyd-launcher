name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e cyd_launcher

      - name: Rename artifact
        run: cp .pio/build/cyd_launcher/firmware.bin CYD-Launcher.bin

      - name: Generar descripción de versión
        run: echo "Version ${{ github.ref_name }}" > CYD-Launcher.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CYD-Launcher.bin
            CYD-Launcher.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
